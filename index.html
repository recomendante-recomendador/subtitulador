<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Subtitulados</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=Poppins:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --font-lyrics: 'Outfit', 'Google Sans', sans-serif;
    --font-ui: 'Plus Jakarta Sans', 'Google Sans', sans-serif;

    --color-text: #ffffff;
    --color-text-dim: rgba(255, 255, 255, 0.32);
    --color-glow: rgba(255, 255, 255, 0.55);

    /* Color de la letra y de su sombra/brillo, editables desde el panel. */
    --lyrics-color: #ffffff;
    --lyrics-glow-color: 255, 255, 255;
    --lyrics-glow-opacity: 0.55;

    --panel-bg: rgba(18, 18, 22, 0.46);
    --panel-border: rgba(255, 255, 255, 0.14);
    --panel-blur: 22px;

    --control-bg: rgba(255, 255, 255, 0.08);
    --control-bg-hover: rgba(255, 255, 255, 0.16);
    --control-border: rgba(255, 255, 255, 0.16);

    --accent: #f2c879;

    --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1c1c22 0%, #050505 75%);
    font-family: var(--font-ui);
  }

  /* ---------- Fondo ---------- */
  #backgroundLayer{
    position: fixed;
    inset: -20px;
    z-index: 0;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1c1c22 0%, #050505 75%);
  }

  #backgroundLayer.empty{
    background: radial-gradient(ellipse at center, #1c1c22 0%, #050505 75%);
  }

  #backgroundLayer.empty #backgroundImage,
  #backgroundLayer.empty #backgroundVideo{
    display: none;
  }

  #backgroundImage,
  #backgroundVideo{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* object-fit: contain conserva la imagen/video completos sin recortar
       detalle, aunque queden bandas vacías; el usuario prefiere esto a un
       recorte tipo "cover". */
    object-fit: contain;
    object-position: center;
    filter: blur(3px) brightness(0.4);
    transform: translate(0px, 0px) scale(1.01);
    transition: filter 0.15s ease, transform 0.15s ease;
    display: none;
  }

  #backgroundImage.visible,
  #backgroundVideo.visible{
    display: block;
  }

  /* ---------- Contenedor de letras ---------- */
  #lyricsViewport{
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #lyricsList{
    width: min(88vw, 600px);
    padding: 15vh 0;
    font-size: clamp(0.85rem, 3.8vmin, 2.05rem);
    transition: transform 0.65s var(--ease-smooth);
    will-change: transform;
  }

  /* En modo dos columnas dejamos un margen lateral extra dentro del ancho
     ya definido arriba, para que el 5% de escalado de la línea activa
     tenga espacio hacia el borde sin desalinearse del resto. */
  #lyricsList.two-column-mode{
    padding-left: 4%;
    padding-right: 4%;
    width: min(96vw, 640px);
  }

  .lyric-line{
    font-family: var(--font-lyrics);
    font-weight: 300;
    font-size: inherit;
    line-height: 1.22;
    text-align: center;
    color: var(--lyrics-color);
    opacity: 0.32;
    filter: blur(1px);
    transform: scale(1);
    padding: 0.45em 0.4em;
    transition: opacity 0.45s var(--ease-smooth),
                filter 0.45s var(--ease-smooth),
                transform 0.45s var(--ease-smooth),
                text-shadow 0.45s var(--ease-smooth);
    letter-spacing: -0.01em;
  }

  .lyric-line.active{
    opacity: 1;
    filter: blur(0);
    font-weight: 400;
    transform: scale(1.05);
    text-shadow: 0 0 22px rgba(var(--lyrics-glow-color), var(--lyrics-glow-opacity)),
                 0 0 2px rgba(var(--lyrics-glow-color), calc(var(--lyrics-glow-opacity) * 0.55));
  }

  /* Texto español dentro de una línea bilingüe */
  .line-es{
    display: block;
  }

  /* Texto en idioma original: secundario, más chico, más tenue */
  .line-original{
    display: block;
    font-weight: 100;
    font-size: 0.82em;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 0.05em;   /* interlineado corto respecto a la línea en español */
    margin-bottom: 0.28em; /* espacio extra antes de la siguiente estrofa */
    letter-spacing: 0;
  }

  .lyric-line.active .line-original{
    color: rgba(255, 255, 255, 0.62);
  }

  /* ---------- Vocales de fondo (Ad-libs / Coros a dos columnas) ---------- */
  .lyric-line{
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  /* Modo dos columnas DESACTIVADO (default): todo centrado, comportamiento estándar */
  .line-content{
    display: flex;
    flex-direction: column;
    width: 100%;
    align-items: center;
    text-align: center;
  }

  /* Vocal de fondo en español: paréntesis clásicos, un poco más chica y más tenue */
  .background-vocal{
    font-size: 0.88em;
    opacity: 0.75;
    transition: opacity 0.40s var(--ease-smooth), transform 0.40s var(--ease-smooth);
  }

  /* Vocal de fondo en idioma original (venía de *texto* dentro de paréntesis):
     un poco más chica y más tenue que la de español */
  .background-vocal.original-language{
    font-size: 0.8em;
    opacity: 0.6;
    transition: opacity 0.40s var(--ease-smooth), transform 0.40s var(--ease-smooth);
  }

  /* Vocal de fondo con marca de tiempo propia (línea separada en el .lrc):
     antes de su momento, se ve más chica y tenue ("pending"); al llegar su
     tiempo, sube a un tamaño/opacidad normal ("activa") sin que la línea
     principal del bloque cambie de opacidad ni se desplace. */
  .timed-bg-vocal{
    transition: opacity 0.35s var(--ease-smooth), transform 0.35s var(--ease-smooth);
  }
  .timed-bg-vocal.pending .background-vocal{
    opacity: 0.35;
    transform: scale(0.9);
  }
  .timed-bg-vocal.bg-active .background-vocal{
    opacity: 1;
    transform: scale(1);
  }

  /* Modo dos columnas ACTIVADO */
  #lyricsList.two-column-mode .line-content{
    text-align: center;
  }

  #lyricsList.two-column-mode .line-content.line-main{
    align-items: flex-start;
    text-align: left;
  }

  #lyricsList.two-column-mode .line-content.line-vocal{
    align-items: flex-end;
    text-align: right;
  }

  /* Al agrandar la línea activa (scale 1.05), en modo dos columnas el texto
     está pegado a un extremo (izquierda o derecha) en vez de centrado, así
     que escalar toda la línea desde el centro empuja ese texto fuera del
     padding hacia su extremo y lo desalinea del resto de las líneas.
     Solución: en este modo, el escalado ya no se aplica a .lyric-line
     completa, sino a cada .line-content por separado, con su punto de
     origen anclado al borde correspondiente (izquierda para la voz
     principal, derecha para la vocal de fondo), para que crezca "hacia
     adentro" sin salirse del contenedor. */
  #lyricsList.two-column-mode .lyric-line.active{
    transform: none;
  }

  #lyricsList.two-column-mode .lyric-line .line-content{
    transition: transform 0.45s var(--ease-smooth);
  }

  /* El transform-origin se fija aquí (fuera de .active) para que sea el
     mismo en TODOS los estados de la línea, activa o no. Si solo se
     definiera dentro de .active, al quitar esa clase el origen volvería
     a su valor por defecto (50% 50%, el centro), y como "transform" está
     en transition, el navegador anima ese cambio de origen junto con el
     scale: el punto desde el que se encoge el texto se desliza del borde
     hacia el centro del bloque durante toda la transición, lo que se ve
     como si el texto "se corriera" hacia la izquierda o derecha al pasar
     de activa a inactiva. Fijándolo siempre igual, el scale crece/encoge
     desde el mismo punto sin importar el estado, y no hay nada que
     desplazar. */
  #lyricsList.two-column-mode .line-content.line-main{
    transform-origin: left center;
  }

  #lyricsList.two-column-mode .line-content.line-vocal{
    transform-origin: right center;
  }

  #lyricsList.two-column-mode .lyric-line.active .line-content.line-main{
    transform: scale(1.05);
  }

  #lyricsList.two-column-mode .lyric-line.active .line-content.line-vocal{
    transform: scale(1.05);
  }

  /* Línea vacía de relleno (limpia el resaltado sin mostrar nada) */
  .lyric-line.spacer{
    opacity: 0 !important;
    filter: none !important;
    transform: none !important;
    text-shadow: none !important;
    pointer-events: none;
  }

  /* ---------- Bloque de metadatos + barra de progreso (fijo, bajo la línea activa) ---------- */
  #trackInfoBlock{
    position: fixed;
    left: 50%;
    top: 50%; /* se recalcula en JS: centro del visor + 3 líneas */
    transform: translateX(-50%);
    z-index: 2;
    width: min(85vw, 620px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #trackMeta{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }

  #trackTitle{
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: clamp(0.68rem, 2.5vmin, 1.02rem);
    color: var(--color-text);
    letter-spacing: -0.005em;
  }

  #trackArtist{
    font-family: var(--font-ui);
    font-weight: 500;
    font-size: clamp(0.58rem, 2vmin, 0.85rem);
    color: var(--color-text);
    opacity: 0.65;
  }

  #trackTitle.hidden-meta,
  #trackArtist.hidden-meta{ display: none; }

  #progressBarWrap{
    display: flex;
    align-items: center;
    gap: 10px;
    width: 77%;
  }

  #progressTime,
  #progressDuration{
    font-family: var(--font-ui);
    font-size: 0.6rem;
    font-weight: 500;
    color: var(--color-text);
    opacity: 0.65;
    font-variant-numeric: tabular-nums;
    min-width: 32px;
  }
  #progressTime{ text-align: right; }
  #progressDuration{ text-align: left; }

  #progressTrack{
    position: relative;
    flex: 1;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
  }

  #progressFill{
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: #f7f5f0;
    box-shadow: 0 0 6px rgba(247, 245, 240, 0.35);
  }

  /* ---------- Barra flotante de control de tiempo (arriba) ---------- */
  #timeBar{
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 7px 8px;
    max-width: 96vw;
    border-radius: 999px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    box-shadow: 0 8px 26px rgba(0,0,0,0.3);
    /* Este botón se mantiene visible aunque el panel principal esté oculto */
  }

  .time-btn{
    font-family: var(--font-ui);
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--color-text);
    background: var(--control-bg);
    border: 1px solid var(--control-border);
    border-radius: 999px;
    padding: 6px 9px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .time-btn:active{ transform: scale(0.94); }
  .time-btn:hover{ background: var(--control-bg-hover); }

  .sync-btn{
    color: #221a08;
    background: var(--accent);
    border-color: var(--accent);
    font-size: 0.7rem;
    padding: 6px 8px;
  }
  .sync-btn:hover{ filter: brightness(1.05); }

  .play-btn{
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 700;
    color: #221a08;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    min-width: 40px;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .play-btn:active{ transform: scale(0.94); }
  .play-btn:hover{ filter: brightness(1.06); }

  .collapsible-title{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    text-align: left;
  }
  .collapse-arrow{
    font-size: 0.8em;
    transition: transform 0.2s ease;
  }
  .collapsible-title.collapsed .collapse-arrow{
    transform: rotate(-90deg);
  }
  .collapsible-content{
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-height: 600px;
    transition: max-height 0.25s ease;
  }
  .collapsible-content.collapsed{
    max-height: 0;
  }

  /* ---------- Panel de control flotante ---------- */
  #controlPanel{
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    width: min(92vw, 420px);
    max-height: 78vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    border-radius: 22px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  #controlPanel.hidden{
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(14px);
  }

  .panel-title{
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.45);
    margin: 4px 2px 0;
    font-weight: 600;
  }

  .row{ display: flex; gap: 8px; }

  .ctrl-btn{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-ui);
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--color-text);
    background: var(--control-bg);
    border: 1px solid var(--control-border);
    border-radius: 12px;
    padding: 11px 10px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .ctrl-btn:active{ transform: scale(0.97); }
  .ctrl-btn:hover{ background: var(--control-bg-hover); }

  .ctrl-btn.primary{
    background: var(--accent);
    color: #221a08;
    border-color: var(--accent);
    font-weight: 600;
  }
  .ctrl-btn.primary:hover{ filter: brightness(1.05); }

  input[type="file"]{ display: none; }
  /* ---------- Barra de acciones de letra: biblioteca + guardar + offset global ---------- */
  #lrcActionsBar{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #lrcActionsBar .ctrl-btn{
    flex: 1 1 calc(50% - 4px);
    min-width: 0;
    font-size: 0.8rem;
    padding: 10px 8px;
  }

  /* Mini notificación de ajuste de ms (aparece bajo la barra de tiempo) */
  #syncToast{
    position: fixed;
    top: 62px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    z-index: 20;
    max-width: min(90vw, 420px);
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    box-shadow: 0 8px 26px rgba(0,0,0,0.3);
    font-family: var(--font-ui);
    font-size: 0.72rem;
    color: var(--color-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #syncToast.visible{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #syncToast .toast-delta{
    color: var(--accent);
    font-weight: 700;
    margin-left: 6px;
  }

  /* ---------- Modal de Biblioteca de letras (.lrc) ---------- */
  #libraryOverlay{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #libraryOverlay.visible{
    opacity: 1;
    pointer-events: auto;
  }

  #libraryModal{
    width: min(92vw, 460px);
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    border-radius: 22px 22px 0 0;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-bottom: none;
    -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    backdrop-filter: blur(var(--panel-blur)) saturate(140%);
    box-shadow: 0 -12px 40px rgba(0,0,0,0.4);
    transform: translateY(14px);
    transition: transform 0.25s ease;
  }
  #libraryOverlay.visible #libraryModal{
    transform: translateY(0);
  }

  @media (min-width: 700px){
    #libraryOverlay{ align-items: center; }
    #libraryModal{
      width: min(70vw, 460px);
      border-radius: 22px;
      border-bottom: 1px solid var(--panel-border);
    }
  }

  #libraryHeader{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #libraryHeader .panel-title{ margin: 0; }

  #libraryCloseBtn{
    font-family: var(--font-ui);
    font-size: 0.9rem;
    line-height: 1;
    color: var(--color-text);
    background: var(--control-bg);
    border: 1px solid var(--control-border);
    border-radius: 999px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #libraryCloseBtn:hover{ background: var(--control-bg-hover); }

  #librarySearchInput{
    width: 100%;
    font-family: var(--font-ui);
    font-size: 0.86rem;
    color: var(--color-text);
    background: var(--control-bg);
    border: 1px solid var(--control-border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  #librarySearchInput::placeholder{ color: var(--color-text-dim); }
  #librarySearchInput:focus{ outline: none; border-color: var(--accent); }

  #libraryList{
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 2px;
  }

  #libraryEmptyMsg{
    color: var(--color-text-dim);
    font-size: 0.82rem;
    text-align: center;
    padding: 18px 6px;
  }

  .library-item{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--control-bg);
    border: 1px solid var(--control-border);
  }

  .library-item-name{
    flex: 1;
    min-width: 0;
    font-family: var(--font-ui);
    font-size: 0.84rem;
    color: var(--color-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .library-item-actions{
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .library-item-btn{
    font-family: var(--font-ui);
    font-size: 0.78rem;
    color: var(--color-text);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--control-border);
    border-radius: 9px;
    padding: 6px 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .library-item-btn:hover{ background: var(--control-bg-hover); }
  .library-item-btn.danger:hover{ background: rgba(255, 90, 90, 0.25); border-color: rgba(255,90,90,0.4); }


  audio{
    display: block;
    width: 100%;
    height: 36px;
    border-radius: 10px;
    accent-color: var(--accent);
    opacity: 1;
    transition: opacity 0.2s ease;
  }

  #player{
    display: none;
  }

  #lrcWrap{
    position: relative;
    width: 100%;
    display: flex;
    align-items: stretch;
    gap: 4px;
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--control-border);
    border-radius: 12px;
  }

  /* Columna central que contiene el textarea y su mirror invisible,
     dejando a los lados el espacio fijo para las flechas indicadoras. */
  #lrcTextCol{
    position: relative;
    flex: 1;
    min-width: 0;
  }

  /* Mirror invisible superpuesto detrás del textarea: replica exactamente
     el mismo texto, fuente, padding y ancho para que sus posiciones de
     línea (offsetTop) coincidan con las del textarea real. Se usa solo
     para calcular en qué altura (px) cae la línea activa; no muestra
     ningún resaltado propio — el indicador visible son las flechas. */
  #lrcMirror{
    position: absolute;
    inset: 0;
    padding: 10px;
    border: 1px solid transparent;
    box-sizing: border-box;
    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;

    justify-content: center;
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
    pointer-events: none;
    /* Posición vertical (top) se calcula en JS según la línea activa */
    position: relative;
  }
  .lrc-arrow .arrow-inner{
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    transition: top 0.2s ease;
  }

  textarea{
    position: relative;
    width: 100%;
    min-height: 220px;
    max-height: 380px;
    resize: vertical;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 12px;
    color: rgba(255,255,255,0.88);
    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.4;
    padding: 10px;
    outline: none;
  }
  textarea:focus{ border-color: rgba(255,255,255,0.35); }

  #recordModeBtn{
    width: 100%;
    margin-top: 2px;
  }

  /* Switch de modo bilingüe */
  .switch-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--control-bg);
    border: 1px solid var(--control-border);
    border-radius: 12px;

  .switch-row span{
    font-size: 0.86rem;
    color: var(--color-text);

  .switch{
    position: relative;

    height: 24px;
    flex-shrink: 0;
  }
  .switch input{
    opacity: 0;
    width: 0;
    height: 0;

  .switch-track{
    position: absolute;
    inset: 0;

    cursor: pointer;

  .switch-track::before{
    content: "";
    position: absolute;
    left: 3px;
    top: 3px;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s ease;
  }
  .switch input:checked + .switch-track{
    background: var(--accent);

  .switch input:checked + .switch-track::before{

  .font-switcher{

  /* Sliders de ajuste de fondo */
  .slider-row{
