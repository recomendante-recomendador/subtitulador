<script>
(function(){
  const backgroundLayer = document.getElementById('backgroundLayer');
  const backgroundImage = document.getElementById('backgroundImage');
  const backgroundVideo = document.getElementById('backgroundVideo');
  const lyricsList = document.getElementById('lyricsList');
  const lyricsViewport = document.getElementById('lyricsViewport');
  const audioInput = document.getElementById('audioInput');
  const bgInput = document.getElementById('bgInput');
  const lrcInput = document.getElementById('lrcInput');
  const lrcMirror = document.getElementById('lrcMirror');
  const lrcMirrorBefore = document.getElementById('lrcMirrorBefore');
  const lrcMirrorActive = document.getElementById('lrcMirrorActive');
  const lrcMirrorAfter = document.getElementById('lrcMirrorAfter');
  const lrcArrowLeft = document.getElementById('lrcArrowLeft');
  const lrcArrowRight = document.getElementById('lrcArrowRight');
  const loadLyricsBtn = document.getElementById('loadLyricsBtn');
  const recordModeBtn = document.getElementById('recordModeBtn');
  const panel = document.getElementById('controlPanel');
  const player = document.getElementById('player');
  const bilingualToggleBtn = document.getElementById('bilingualToggleBtn');
  const twoColumnToggleBtn = document.getElementById('twoColumnToggleBtn');
  const fontSizeSlider = document.getElementById('fontSizeSlider');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const back5Btn = document.getElementById('back5Btn');
  const back1Btn = document.getElementById('back1Btn');
  const fwd1Btn = document.getElementById('fwd1Btn');
  const fwd5Btn = document.getElementById('fwd5Btn');
  const syncMinusBtn = document.getElementById('syncMinusBtn');
  const syncPlusBtn = document.getElementById('syncPlusBtn');
  const syncMinus50Btn = document.getElementById('syncMinus50Btn');
  const syncPlus50Btn = document.getElementById('syncPlus50Btn');
  const playPauseBtn = document.getElementById('playPauseBtn');

  const trackInfoBlock = document.getElementById('trackInfoBlock');
  const trackTitleEl = document.getElementById('trackTitle');
  const trackArtistEl = document.getElementById('trackArtist');
  const progressTimeEl = document.getElementById('progressTime');
  const progressDurationEl = document.getElementById('progressDuration');
  const progressFillEl = document.getElementById('progressFill');

  const fontSwitcher = document.getElementById('fontSwitcher');

  const bgScaleInput = document.getElementById('bgScale');
  const bgPosXInput = document.getElementById('bgPosX');
  const bgPosYInput = document.getElementById('bgPosY');
  const bgBrightnessInput = document.getElementById('bgBrightness');
  const bgBlurInput = document.getElementById('bgBlur');
  const bgHueInput = document.getElementById('bgHue');
  const bgScaleVal = document.getElementById('bgScaleVal');
  const bgPosXVal = document.getElementById('bgPosXVal');
  const bgPosYVal = document.getElementById('bgPosYVal');
  const bgBrightnessVal = document.getElementById('bgBrightnessVal');
  const bgBlurVal = document.getElementById('bgBlurVal');
  const bgHueVal = document.getElementById('bgHueVal');

  // ---------- Nuevos elementos: toast de sync, biblioteca .lrc, offset global ----------
  const syncToast = document.getElementById('syncToast');
  const shiftAllMinusBtn = document.getElementById('shiftAllMinusBtn');
  const shiftAllPlusBtn = document.getElementById('shiftAllPlusBtn');
  const openLibraryBtn = document.getElementById('openLibraryBtn');
  const saveToLibraryBtn = document.getElementById('saveToLibraryBtn');
  const libraryOverlay = document.getElementById('libraryOverlay');
  const libraryCloseBtn = document.getElementById('libraryCloseBtn');
  const librarySearchInput = document.getElementById('librarySearchInput');
  const libraryList = document.getElementById('libraryList');
  const libraryEmptyMsg = document.getElementById('libraryEmptyMsg');

  const LRC_STORAGE_KEY = 'lyricsPlayer.savedLrc';

  let lyricsData = [];
  let currentActiveIndex = -1;

  // ---------- LRC precargado de ejemplo ----------
  const EXAMPLE_LRC = `[00:00.50]Bienvenido, Cali.`;

  lrcInput.value = EXAMPLE_LRC;

  // Si hay letra guardada de una sesión anterior, se antepone al ejemplo
  try {
    const savedLrc = localStorage.getItem(LRC_STORAGE_KEY);
    if (savedLrc){
      lrcInput.value = savedLrc;
    }
  } catch (err) {
    // localStorage puede fallar en modo privado; se ignora y sigue con el ejemplo
  }

  // ---------- Parser LRC ----------
  // Cada línea de letra sigue siempre esta estructura de 4 partes fijas,
  // todas opcionales salvo la principal:
  //   Principal[*Original*][(FondoEs)][(*FondoOriginal*)]
  // Ejemplos reales:
  //   Hola
  //   Hola*Hello*
  //   Hola(Sí)
  //   Hola*Hello*(Sí)(*Yeah*)
  const LINE_STRUCTURE_EXP = /^(.*?)(?:\*(.*?)\*)?(?:\((.*?)\))?(?:\(\*(.*?)\*\))?$/;

  // Separa el texto de una línea en sus hasta 4 segmentos posibles, en el
  // orden fijo en que siempre aparecen. Cada segmento resultante indica si
  // es vocal de fondo (columna derecha) y si es idioma original.
  function segmentLine(text){
    const trimmed = text.trim();
    const segments = [];
    if (!trimmed) return segments;

    const match = trimmed.match(LINE_STRUCTURE_EXP);

    const mainText = match && match[1] ? match[1].trim() : '';
    const originalText = match && match[2] ? match[2].trim() : '';
    const bgEsText = match && match[3] ? match[3].trim() : '';
    const bgOriginalText = match && match[4] ? match[4].trim() : '';

    if (mainText){
      segments.push({ display: mainText, isBackgroundVocal: false, isOriginalLanguage: false });
    }
    if (originalText){
      segments.push({ display: originalText, isBackgroundVocal: false, isOriginalLanguage: true });
    }
    if (bgEsText){
      segments.push({ display: `(${bgEsText})`, isBackgroundVocal: true, isOriginalLanguage: false });
    }
    if (bgOriginalText){
      segments.push({ display: `(${bgOriginalText})`, isBackgroundVocal: true, isOriginalLanguage: true });
    }

    // Si por alguna razón el patrón no reconoció nada (texto atípico), se
    // conserva el texto completo como línea principal para no perder datos.
    if (segments.length === 0 && trimmed){
      segments.push({ display: trimmed, isBackgroundVocal: false, isOriginalLanguage: false });
    }

    return segments;
  }

  // Cuando el modo bilingüe está desactivado, se descarta todo lo que sea
  // idioma original (tanto la línea *original* como la vocal de fondo
  // (*original*)), dejando solo lo que está en español.
  function filterByBilingualMode(segments, bilingualEnabled){
    if (bilingualEnabled) return segments;
    return segments.filter(seg => !seg.isOriginalLanguage);
  }

  // Un bloque de segmentos es "puramente de fondo" cuando TODOS sus
  // segmentos son vocal de fondo (no tiene ninguna parte principal). Esto
  // ocurre cuando una línea del .lrc se escribe solo con paréntesis, ej.
  // "(Mi amigo)(*My friend*)" en su propia marca de tiempo, para darle un
  // momento de activación independiente de la línea principal anterior.
  function isPureBackgroundSegments(segments){
    return segments.length > 0 && segments.every(seg => seg.isBackgroundVocal);
  }

  function parseLRC(rawText, bilingualEnabled){
    const timeTagExp = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
    const parsed = [];
    const rawLines = rawText.split('\n');

    rawLines.forEach((rawLine, lineNumber) => {
      const line = rawLine.trim();
      if (!line) return;

      const tags = [...line.matchAll(timeTagExp)];
      if (tags.length === 0) return;

      // Ya no se descarta si el texto queda vacío: una etiqueta de tiempo sin
      // letra se conserva como línea "spacer" para limpiar el resaltado al final.
      const rawContent = line.replace(timeTagExp, '').trim();
      const allSegments = segmentLine(rawContent);
      const segments = filterByBilingualMode(allSegments, bilingualEnabled);
      const isSpacer = segments.length === 0;
      const isPureBackgroundLine = !isSpacer && isPureBackgroundSegments(segments);

      tags.forEach(tag => {
        const minutes = parseInt(tag[1], 10);
        const seconds = parseInt(tag[2], 10);
        let fraction = tag[3] ? tag[3] : '0';
        if (fraction.length === 1) fraction += '00';
        if (fraction.length === 2) fraction += '0';
        const ms = parseInt(fraction, 10);
        const time = minutes * 60 + seconds + ms / 1000;
        // sourceLine: índice (0-based) de la línea del textarea de la que
        // vino esta entrada. Permite ubicar/resaltar/editar esa línea del
        // .lrc en tiempo real sin tener que re-parsear todo el texto.
        parsed.push({ time, segments, isSpacer, isPureBackgroundLine, sourceLine: lineNumber });
      });
    });

    parsed.sort((a, b) => a.time - b.time);

    // Fusiona cada línea puramente de fondo con el bloque principal anterior:
    // no se convierte en su propia entrada de lyricsData (no genera un
    // .lyric-line aparte ni desplaza el scroll), sino que queda guardada
    // como bgVocals dentro del bloque principal, con su propio tiempo de
    // activación independiente. Si no hay línea principal previa (la letra
    // empieza directamente con una vocal de fondo), se conserva como bloque
    // propio para no perder datos.
    const merged = [];
    parsed.forEach((item) => {
      if (item.isPureBackgroundLine){
        const prevMain = merged.length ? merged[merged.length - 1] : null;
        if (prevMain && !prevMain.isSpacer){
          if (!prevMain.bgVocals) prevMain.bgVocals = [];
          prevMain.bgVocals.push({ time: item.time, segments: item.segments });
          return;
        }
      }
      merged.push(item);
    });

    return merged;
  }

  // ---------- Negritas/itálicas dentro de una línea ----------
  // Permite envolver palabras sueltas con <b>...</b> o <i>...</i> dentro del
  // texto de una línea del .lrc. Se procesa de forma segura: primero se
  // escapan por completo los caracteres especiales de HTML (para que el
  // texto del usuario nunca se interprete como marcado arbitrario), y luego
  // se "reabren" únicamente las etiquetas <b>, </b>, <i>, </i> ya escapadas,
  // convirtiéndolas de vuelta a elementos reales. Cualquier otra etiqueta
  // queda como texto literal (inofensivo) en pantalla.
  const RICH_TAG_EXP = /&lt;(\/?)(b|i)&gt;/gi;

  function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function setRichText(el, text){
    const escaped = escapeHtml(text);
    const withTags = escaped.replace(RICH_TAG_EXP, (_, closing, tag) => {
      return closing ? `</${tag}>` : `<${tag}>`;
    });
    el.innerHTML = withTags;
  }
  function parseLRCMeta(rawText){
    const tiMatch = rawText.match(/\[ti\s*:\s*(.*?)\]/i);
    const arMatch = rawText.match(/\[ar\s*:\s*(.*?)\]/i);
    return {
      title: tiMatch ? tiMatch[1].trim() : '',
      artist: arMatch ? arMatch[1].trim() : ''
    };
  }

  function applyTrackMeta(rawText){
    const meta = parseLRCMeta(rawText);

    trackTitleEl.textContent = meta.title;
    trackTitleEl.classList.toggle('hidden-meta', !meta.title);

    trackArtistEl.textContent = meta.artist;
    trackArtistEl.classList.toggle('hidden-meta', !meta.artist);
  }

  // ---------- Render ----------
  function renderLyrics(){
    lyricsList.innerHTML = '';
    lyricsData.forEach((item) => {
      const div = document.createElement('div');
      div.className = 'lyric-line';

      if (item.isSpacer){
        div.classList.add('spacer');
        div.innerHTML = '&nbsp;';
      } else {
        // Cada línea tiene hasta 4 segmentos posibles en orden fijo: principal,
        // original, fondo-es, fondo-original. Cada uno se renderiza en su propio
        // bloque .line-content para poder alinearlo a la izquierda (principal)
        // o derecha (fondo) en el modo de dos columnas.
        item.segments.forEach((seg) => {
          const content = document.createElement('div');
          content.className = 'line-content';
          content.classList.add(seg.isBackgroundVocal ? 'line-vocal' : 'line-main');

          const span = document.createElement('span');
          span.className = seg.isOriginalLanguage ? 'line-original' : 'line-es';
          if (seg.isBackgroundVocal) span.classList.add('background-vocal');
          if (seg.isOriginalLanguage) span.classList.add('original-language');
          setRichText(span, seg.display);

          content.appendChild(span);
          div.appendChild(content);
        });

        // Vocales de fondo con marca de tiempo propia (ej. "(Mi amigo)" en
        // su propio [mm:ss.xx] tras la línea principal): se dibujan dentro
        // del mismo bloque, ya en la columna derecha, pero empiezan en
        // estado "pending" (más chicas y tenues) hasta que su tiempo llegue
        // — no desplazan ni cambian la opacidad de la línea principal.
        if (item.bgVocals && item.bgVocals.length){
          item.bgVocals.forEach((bg, bgIndex) => {
            bg.segments.forEach((seg) => {
              const content = document.createElement('div');
              content.className = 'line-content line-vocal timed-bg-vocal pending';
              content.dataset.bgIndex = String(bgIndex);

              const span = document.createElement('span');
              span.className = seg.isOriginalLanguage ? 'line-original' : 'line-es';
              span.classList.add('background-vocal');
              if (seg.isOriginalLanguage) span.classList.add('original-language');
              setRichText(span, seg.display);

              content.appendChild(span);
              div.appendChild(content);
            });
          });
        }
      }

      lyricsList.appendChild(div);
    });
    currentActiveIndex = -1;
    lyricsList.style.transform = 'translateY(0px)';
    updateLineDistances(currentActiveIndex);
  }

  function loadLyricsFromTextarea(){
    lyricsData = parseLRC(lrcInput.value, bilingualToggleBtn.classList.contains('active'));
    applyTrackMeta(lrcInput.value);
    renderLyrics();
    positionTrackInfoBlock();

    try {
      localStorage.setItem(LRC_STORAGE_KEY, lrcInput.value);
    } catch (err) {
      // localStorage puede fallar en modo privado o sin espacio; no es crítico
    }

    persistLrcText(lrcInput.value);
  }

  // ---------- Resaltado + auto-scroll de la línea activa dentro del .lrc ----------
  // Calcula el índice de carácter (dentro de todo el texto del textarea)
  // donde empieza y termina una línea lógica dada.
  function getLrcLineCharRange(lineNumber){
    const allLines = lrcInput.value.split('\n');
    let start = 0;
    for (let i = 0; i < lineNumber; i++){
      start += allLines[i].length + 1; // +1 por el salto de línea
    }
    const lineText = allLines[lineNumber] !== undefined ? allLines[lineNumber] : '';
    return { start, end: start + lineText.length };
  }

  // Marca la línea activa con dos flechas (› ‹) a los lados del textarea,
  // usando un "mirror" invisible superpuesto que replica el mismo texto
  // exacto (misma fuente/ancho/padding) para calcular en qué altura (px)
  // cae esa línea — el navegador hace el wrap de texto de forma idéntica
  // en ambos, así que la medición es exacta incluso con líneas largas.
  // Las flechas se posicionan según esa altura, ya convertida a coordenadas
  // visibles del textarea (restando el scroll actual) y acotada dentro del
  // área visible para que nunca queden fuera de vista.
  function updateLrcHighlight(){
    const activeItem = lyricsData[currentActiveIndex];
    const fullText = lrcInput.value;

    if (!activeItem || activeItem.sourceLine === undefined){
      lrcMirrorBefore.textContent = fullText;
      lrcMirrorActive.textContent = '';
      lrcMirrorAfter.textContent = '';
      lrcArrowLeft.style.visibility = 'hidden';
      lrcArrowRight.style.visibility = 'hidden';
      return;
    }

    const { start, end } = getLrcLineCharRange(activeItem.sourceLine);
    lrcMirrorBefore.textContent = fullText.slice(0, start);
    lrcMirrorActive.textContent = fullText.slice(start, end);
    lrcMirrorAfter.textContent = fullText.slice(end);

    // offsetTop del span activo dentro del mirror = posición "natural" de
    // esa línea sin importar el scroll (el mirror no tiene scroll propio).
    const naturalTop = lrcMirrorActive.offsetTop;
    const naturalHeight = lrcMirrorActive.offsetHeight || 17;
    const naturalBottom = naturalTop + naturalHeight;

    const visibleTop = lrcInput.scrollTop;
    const visibleBottom = visibleTop + lrcInput.clientHeight;
    const margin = naturalHeight;

    // Auto-scroll: solo si la línea activa no está ya visible, para no
    // pelear con un scroll manual del usuario mientras edita.
    if (naturalTop < visibleTop + margin || naturalBottom > visibleBottom - margin){
      lrcInput.scrollTop = Math.max(0, naturalTop - lrcInput.clientHeight / 2 + naturalHeight / 2);
    }

    // Posición de las flechas: altura de la línea activa relativa al área
    // visible actual del textarea (ya con el scroll aplicado/actualizado).
    const visibleCenter = naturalTop + naturalHeight / 2 - lrcInput.scrollTop;
    const clampedCenter = Math.max(10, Math.min(lrcInput.clientHeight - 10, visibleCenter));

    lrcArrowLeft.style.visibility = 'visible';
    lrcArrowRight.style.visibility = 'visible';
    lrcArrowLeft.querySelector('.arrow-inner').style.top = `${clampedCenter}px`;
    lrcArrowRight.querySelector('.arrow-inner').style.top = `${clampedCenter}px`;

    syncLrcMirrorScroll();
  }

  function syncLrcMirrorScroll(){
    lrcMirror.style.transform = `translateY(${-lrcInput.scrollTop}px)`;
  }
  lrcInput.addEventListener('scroll', () => {
    syncLrcMirrorScroll();
    updateLrcHighlight();
  });
  lrcInput.addEventListener('input', updateLrcHighlight);

  // ---------- Ajuste fino de sincronización (-10ms / +10ms) ----------
  // Reescribe todas las etiquetas de tiempo [mm:ss.xx] de la línea activa del
  // .lrc sumando/restando el delta indicado (en milisegundos), sin tocar el
  // resto del texto de esa línea ni de las demás líneas.
  const TIME_TAG_EXP_GLOBAL = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

  function formatTimeTag(totalSeconds){
    if (totalSeconds < 0) totalSeconds = 0;
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = Math.floor(totalSeconds % 60);
    const ms = Math.round((totalSeconds - Math.floor(totalSeconds)) * 1000);
    return `[${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(ms).padStart(3, '0')}]`;
  }

  function adjustActiveLineTiming(deltaMs){
    const activeItem = lyricsData[currentActiveIndex];
    if (!activeItem || activeItem.sourceLine === undefined) return;

    const lines = lrcInput.value.split('\n');
    const lineNumber = activeItem.sourceLine;
    const originalLine = lines[lineNumber];
    if (originalLine === undefined) return;

    const deltaSeconds = deltaMs / 1000;

    const newLine = originalLine.replace(TIME_TAG_EXP_GLOBAL, (fullMatch, mm, ss, frac) => {
      const minutes = parseInt(mm, 10);
      const seconds = parseInt(ss, 10);
      let fraction = frac ? frac : '0';
      if (fraction.length === 1) fraction += '00';
      if (fraction.length === 2) fraction += '0';
      const ms = parseInt(fraction, 10);
      const time = minutes * 60 + seconds + ms / 1000;
      return formatTimeTag(time + deltaSeconds);
    });

    lines[lineNumber] = newLine;
    lrcInput.value = lines.join('\n');

    // Recarga automática: no hace falta pulsar "Cargar Letra".
    loadLyricsFromTextarea();

    // Tras recargar, currentActiveIndex se resetea a -1 dentro de
    // renderLyrics/loadLyricsFromTextarea; se reubica la línea activa según
    // el tiempo actual de reproducción para que el resaltado y el highlight
    // del .lrc no se pierdan tras el ajuste.
    const idx = findActiveIndex(player.currentTime);
    setActiveLine(idx);

    // Mini notificación con la línea ya actualizada, ej: "[02:30.30]Hola (-10ms)"
    showSyncToast(newLine.trim(), deltaMs);
  }

  // ---------- Mini notificación (toast) de ajuste de milisegundos ----------
  // Muestra debajo de la barra de tiempo la línea del .lrc que acaba de
  // ajustarse, junto con el delta aplicado, ej: "[02:30.30]Hola (-10ms)".
  let syncToastHideTimer = null;
  function showSyncToast(lineText, deltaMs){
    const sign = deltaMs > 0 ? '+' : '';
    syncToast.innerHTML = '';
    const lineSpan = document.createElement('span');
    lineSpan.textContent = lineText;
    const deltaSpan = document.createElement('span');
    deltaSpan.className = 'toast-delta';
    deltaSpan.textContent = `(${sign}${deltaMs}ms)`;
    syncToast.appendChild(lineSpan);
    syncToast.appendChild(deltaSpan);
    syncToast.classList.add('visible');

    clearTimeout(syncToastHideTimer);
    syncToastHideTimer = setTimeout(() => {
      syncToast.classList.remove('visible');
    }, 1800);
  }

  syncMinusBtn.addEventListener('click', (e) => { e.stopPropagation(); adjustActiveLineTiming(-10); });
  syncPlusBtn.addEventListener('click', (e) => { e.stopPropagation(); adjustActiveLineTiming(10); });
  syncMinus50Btn.addEventListener('click', (e) => { e.stopPropagation(); adjustActiveLineTiming(-50); });
  syncPlus50Btn.addEventListener('click', (e) => { e.stopPropagation(); adjustActiveLineTiming(50); });

  // ---------- Offset global: sumar/restar 100ms a TODAS las líneas del .lrc ----------
  // A diferencia de adjustActiveLineTiming (que solo toca la línea activa),
  // esto recorre cada línea del textarea y desplaza cualquier etiqueta de
  // tiempo [mm:ss.xx] que encuentre, sin importar si hay una línea activa.
  function shiftAllLinesTiming(deltaMs){
    const deltaSeconds = deltaMs / 1000;
    const lines = lrcInput.value.split('\n');
    let shiftedCount = 0;

    const newLines = lines.map((line) => {
      if (!TIME_TAG_EXP_GLOBAL.test(line)) return line;
      TIME_TAG_EXP_GLOBAL.lastIndex = 0; // reset tras el test() con flag global

      const newLine = line.replace(TIME_TAG_EXP_GLOBAL, (fullMatch, mm, ss, frac) => {
        const minutes = parseInt(mm, 10);
        const seconds = parseInt(ss, 10);
        let fraction = frac ? frac : '0';
        if (fraction.length === 1) fraction += '00';
        if (fraction.length === 2) fraction += '0';
        const ms = parseInt(fraction, 10);
        const time = minutes * 60 + seconds + ms / 1000;
        return formatTimeTag(time + deltaSeconds);
      });

      shiftedCount++;
      return newLine;
    });

    if (shiftedCount === 0) return;

    lrcInput.value = newLines.join('\n');
    loadLyricsFromTextarea();

    const idx = findActiveIndex(player.currentTime);
    setActiveLine(idx);

    // El toast, en este caso, muestra cuántas líneas se movieron en total.
    showSyncToast(`${shiftedCount} líneas desplazadas`, deltaMs);
  }

  shiftAllMinusBtn.addEventListener('click', (e) => { e.stopPropagation(); shiftAllLinesTiming(-100); });
  shiftAllPlusBtn.addEventListener('click', (e) => { e.stopPropagation(); shiftAllLinesTiming(100); });

  // Posiciona el bloque de metadatos + barra de progreso exactamente 3 líneas
  // por debajo de la línea activa. Como la línea activa siempre queda
  // centrada verticalmente en el visor (ver centerActiveLine), esta posición
  // es constante respecto al viewport y solo depende de la altura real de
  // una línea de letra renderizada.
  function positionTrackInfoBlock(){
    const sampleLine = lyricsList.querySelector('.lyric-line:not(.spacer)') || lyricsList.querySelector('.lyric-line');
    let lineHeight = 48; // valor de respaldo razonable si aún no hay líneas renderizadas
    if (sampleLine){
      const measured = sampleLine.getBoundingClientRect().height;
      if (measured > 0) lineHeight = measured;
    }

    const vpRect = lyricsViewport.getBoundingClientRect();
    const centerY = vpRect.top + vpRect.height / 2;
    const maxTop = vpRect.top + vpRect.height * 0.94; // evita que se salga del encuadre en pantallas muy bajas
    const top = Math.min(centerY + lineHeight * 2, maxTop);

    trackInfoBlock.style.top = `${top}px`;
  }

  function centerActiveLine(){
    const activeEl = lyricsList.children[currentActiveIndex];
    if (!activeEl){
      lyricsList.style.transform = 'translateY(0px)';
      return;
    }
    const viewportHeight = lyricsViewport.clientHeight;
    const offset = activeEl.offsetTop + activeEl.offsetHeight / 2 - viewportHeight / 2;
    lyricsList.style.transform = `translateY(${-offset}px)`;
  }

  function setActiveLine(index){
    const prevEl = lyricsList.children[currentActiveIndex];
    if (prevEl) prevEl.classList.remove('active');

    currentActiveIndex = index;

    const activeEl = lyricsList.children[currentActiveIndex];
    if (activeEl) activeEl.classList.add('active');

    centerActiveLine();
    updateLineDistances(currentActiveIndex);
    updateLrcHighlight();
    updateTimedBgVocals(player.currentTime);
  }

  // Desvanecimiento por distancia de línea, simétrico hacia arriba y hacia
  // abajo: misma progresión de opacidad/blur en ambos sentidos.
  const FADE_STEPS = [
    { opacity: 0.65, blur: 0.6 },  // distancia 1 (línea inmediatamente anterior/siguiente)
    { opacity: 0.40, blur: 1.2 },  // distancia 2
  ];
  const FADE_BEYOND = { opacity: 0.05, blur: 2.4 }; // distancia 3 o más

  function updateLineDistances(activeIndex){
    const children = lyricsList.children;

    for (let i = 0; i < children.length; i++){
      const el = children[i];

      if (i === activeIndex){
        el.style.opacity = '';
        el.style.filter = '';
        continue;
      }

      const distance = Math.abs(i - activeIndex);
      const step = distance <= 2 ? FADE_STEPS[distance - 1] : FADE_BEYOND;

      el.style.opacity = step.opacity;
      el.style.filter = `blur(${step.blur}px)`;
    }
  }

  function findActiveIndex(currentTime){
    let idx = -1;
    for (let i = 0; i < lyricsData.length; i++){
      if (lyricsData[i].time <= currentTime) idx = i;
      else break;
    }
    return idx;
  }

  // Activa/desactiva, dentro del bloque principal actualmente en pantalla,
  // cada vocal de fondo que tiene su propia marca de tiempo — sin tocar la
  // opacidad ni la posición de la línea principal del bloque. Se revisa en
  // cada timeupdate junto con el índice de línea principal.
  function updateTimedBgVocals(currentTime){
    const activeItem = lyricsData[currentActiveIndex];
    const activeEl = lyricsList.children[currentActiveIndex];
    if (!activeItem || !activeEl || !activeItem.bgVocals) return;

    const nodes = activeEl.querySelectorAll('.timed-bg-vocal');
    nodes.forEach((node) => {
      const bgIndex = parseInt(node.dataset.bgIndex, 10);
      const bg = activeItem.bgVocals[bgIndex];
      if (!bg) return;
      const isActive = currentTime >= bg.time;
      node.classList.toggle('bg-active', isActive);
      node.classList.toggle('pending', !isActive);
    });
  }

  // ---------- Barra de progreso / tiempo ----------
  function formatTime(seconds){
    if (!isFinite(seconds) || seconds < 0) seconds = 0;
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function updateProgressUI(){
    const duration = player.duration || 0;
    const current = player.currentTime || 0;
    const pct = duration > 0 ? Math.min(100, (current / duration) * 100) : 0;

    progressFillEl.style.width = `${pct}%`;
    progressTimeEl.textContent = formatTime(current);
    progressDurationEl.textContent = formatTime(duration);
  }

  // ---------- Eventos de audio ----------
  player.addEventListener('timeupdate', () => {
    const idx = findActiveIndex(player.currentTime);
    if (idx !== currentActiveIndex) setActiveLine(idx);
    updateTimedBgVocals(player.currentTime);
    updateProgressUI();
  });

  player.addEventListener('seeked', () => {
    const idx = findActiveIndex(player.currentTime);
    setActiveLine(idx);
    updateTimedBgVocals(player.currentTime);
    updateProgressUI();
  });

  player.addEventListener('loadedmetadata', updateProgressUI);
  player.addEventListener('durationchange', updateProgressUI);

  // ---------- Carga de archivos ----------
  audioInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    player.src = url;
    player.load();
    persistAudioFile(file);
  });

  bgInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const isVideo = file.type.startsWith('video/');

    backgroundLayer.classList.remove('empty');

    if (isVideo){
      backgroundImage.classList.remove('visible');
      backgroundImage.removeAttribute('src');
      backgroundVideo.src = url;
      backgroundVideo.classList.add('visible');
      backgroundVideo.play().catch(() => {
        // Algunos navegadores requieren un gesto explícito; se ignora si falla,
        // el propio play/pause de la canción o un tap del usuario lo destraba.
      });
    } else {
      backgroundVideo.classList.remove('visible');
      backgroundVideo.pause();
      backgroundVideo.removeAttribute('src');
      backgroundImage.src = url;
      backgroundImage.classList.add('visible');
    }

    persistBackgroundFile(file);
  });

  loadLyricsBtn.addEventListener('click', loadLyricsFromTextarea);
  bilingualToggleBtn.addEventListener('click', () => {
    bilingualToggleBtn.classList.toggle('active');
    loadLyricsFromTextarea();
    persistVisualSettings();
  });

  // ---------- Vocales de fondo (modo dos columnas) ----------
  twoColumnToggleBtn.addEventListener('click', () => {
    twoColumnToggleBtn.classList.toggle('active');
    lyricsList.classList.toggle('two-column-mode', twoColumnToggleBtn.classList.contains('active'));
    persistVisualSettings();
  });

  // ---------- Slider de tamaño de fuente (8px a 24px) ----------
  function updateFontSize(){
    const size = parseInt(fontSizeSlider.value, 10);
    lyricsList.style.setProperty('--lyrics-font-size', `${size}px`);
    lyricsList.style.fontSize = `${size}px`;
    fontSizeVal.textContent = `${size}px`;
  }
  fontSizeSlider.addEventListener('input', updateFontSize);
  fontSizeSlider.addEventListener('change', persistVisualSettings);
  updateFontSize();

  // ---------- Color de la letra (base, brillo/sombra y su opacidad) ----------
  const lyricsColorPicker = document.getElementById('lyricsColorPicker');
  const lyricsColorSwatch = document.getElementById('lyricsColorSwatch');
  const lyricsColorHex = document.getElementById('lyricsColorHex');
  const lyricsGlowColorPicker = document.getElementById('lyricsGlowColorPicker');
  const lyricsGlowColorSwatch = document.getElementById('lyricsGlowColorSwatch');
  const lyricsGlowColorHex = document.getElementById('lyricsGlowColorHex');
  const lyricsGlowOpacityInput = document.getElementById('lyricsGlowOpacity');
  const lyricsGlowOpacityVal = document.getElementById('lyricsGlowOpacityVal');

  // Convierte "#rrggbb" a "r, g, b" para poder usarlo dentro de rgba() en CSS.
  function hexToRgbString(hex){
    const clean = hex.replace('#', '');
    const r = parseInt(clean.substring(0, 2), 16);
    const g = parseInt(clean.substring(2, 4), 16);
    const b = parseInt(clean.substring(4, 6), 16);
    return `${r}, ${g}, ${b}`;
  }

  function isValidHex(value){
    return /^#([0-9a-fA-F]{6})$/.test(value);
  }

  function applyLyricsColor(hex){
    document.documentElement.style.setProperty('--lyrics-color', hex);
    lyricsColorSwatch.style.background = hex;
    lyricsColorPicker.value = hex;
    lyricsColorHex.value = hex;
  }

  function applyLyricsGlowColor(hex){
    document.documentElement.style.setProperty('--lyrics-glow-color', hexToRgbString(hex));
    lyricsGlowColorSwatch.style.background = hex;
    lyricsGlowColorPicker.value = hex;
    lyricsGlowColorHex.value = hex;
  }

  applyLyricsColor(lyricsColorPicker.value);
  applyLyricsGlowColor(lyricsGlowColorPicker.value);

  lyricsColorPicker.addEventListener('input', () => applyLyricsColor(lyricsColorPicker.value));
  lyricsGlowColorPicker.addEventListener('input', () => applyLyricsGlowColor(lyricsGlowColorPicker.value));

  lyricsColorHex.addEventListener('input', () => {
    let value = lyricsColorHex.value.trim();
    if (value && !value.startsWith('#')) value = `#${value}`;
    if (isValidHex(value)) applyLyricsColor(value);
  });

  lyricsGlowColorHex.addEventListener('input', () => {
    let value = lyricsGlowColorHex.value.trim();
    if (value && !value.startsWith('#')) value = `#${value}`;
    if (isValidHex(value)) applyLyricsGlowColor(value);
  });

  function updateLyricsGlowOpacity(){
    const opacity = parseFloat(lyricsGlowOpacityInput.value);
    document.documentElement.style.setProperty('--lyrics-glow-opacity', opacity);
    lyricsGlowOpacityVal.textContent = opacity.toFixed(2);
  }
  lyricsGlowOpacityInput.addEventListener('input', updateLyricsGlowOpacity);
  updateLyricsGlowOpacity();

  // ---------- Selector de fuente de letra ----------
  const FONT_MAP = {
    outfit: "'Outfit', 'Google Sans', sans-serif",
    times: "'Times New Roman', Times, serif",
    googlesans: "'Poppins', 'Google Sans', sans-serif",
    chivomono: "'Chivo Mono', 'Courier New', monospace"
  };

  fontSwitcher.addEventListener('click', (e) => {
    const btn = e.target.closest('.font-option');
    if (!btn) return;

    const fontKey = btn.dataset.font;
    document.documentElement.style.setProperty('--font-lyrics', FONT_MAP[fontKey]);

    fontSwitcher.querySelectorAll('.font-option').forEach((opt) => {
      opt.classList.toggle('active', opt === btn);
    });

    persistVisualSettings();
  });

  // ---------- Ajustes de fondo (escala, posición, brillo, desenfoque, matiz) ----------
  function updateBackgroundStyle(){
    const scale = parseFloat(bgScaleInput.value);
    const x = parseFloat(bgPosXInput.value);
    const y = parseFloat(bgPosYInput.value);
    const brightness = parseFloat(bgBrightnessInput.value);
    const blur = parseFloat(bgBlurInput.value);
    const hue = parseFloat(bgHueInput.value);

    const transform = `translate(${x}px, ${y}px) scale(${scale})`;
    const filter = `blur(${blur}px) brightness(${brightness}) hue-rotate(${hue}deg)`;

    backgroundImage.style.transform = transform;
    backgroundImage.style.filter = filter;
    backgroundVideo.style.transform = transform;
    backgroundVideo.style.filter = filter;

    bgScaleVal.textContent = scale.toFixed(2);
    bgPosXVal.textContent = `${x}px`;
    bgPosYVal.textContent = `${y}px`;
    bgBrightnessVal.textContent = brightness.toFixed(2);
    bgBlurVal.textContent = `${blur}px`;
    bgHueVal.textContent = `${hue}°`;
  }

  [bgScaleInput, bgPosXInput, bgPosYInput, bgBrightnessInput, bgBlurInput, bgHueInput].forEach((input) => {
    input.addEventListener('input', updateBackgroundStyle);
    input.addEventListener('change', persistVisualSettings);
  });

  updateBackgroundStyle();

  // ---------- Controles de tiempo ----------
  function seekBy(deltaSeconds){
    if (!player.duration) {
      player.currentTime = Math.max(0, player.currentTime + deltaSeconds);
      return;
    }
    player.currentTime = Math.min(
      Math.max(0, player.currentTime + deltaSeconds),
      player.duration
    );
  }

  back5Btn.addEventListener('click', (e) => { e.stopPropagation(); seekBy(-10); });
  back1Btn.addEventListener('click', (e) => { e.stopPropagation(); seekBy(-3); });
  fwd1Btn.addEventListener('click', (e) => { e.stopPropagation(); seekBy(3); });
  fwd5Btn.addEventListener('click', (e) => { e.stopPropagation(); seekBy(10); });

  // ---------- Play / Pause central ----------
  function updatePlayPauseIcon(){
    playPauseBtn.textContent = player.paused ? '▶' : '❚❚';
  }

  playPauseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (player.paused){
      player.play();
    } else {
      player.pause();
    }
  });

  player.addEventListener('play', updatePlayPauseIcon);
  player.addEventListener('pause', updatePlayPauseIcon);
  updatePlayPauseIcon();

  // ---------- Desplazamiento táctil (scrubbing) ----------
  let isDragging = false;
  let dragMoved = false;
  let dragStartY = 0;
  let dragStartOffset = 0;
  let wasPlayingBeforeDrag = false;

  function getCurrentTranslateY(){
    const matrix = new DOMMatrixReadOnly(window.getComputedStyle(lyricsList).transform);
    return matrix.m42;
  }

  // Encuentra la línea más cercana al centro del visor dado un offset de
  // desplazamiento, y la marca como activa (sin recentrar con transición,
  // ya que el propio dedo/mouse está controlando la posición en ese momento).
  function updateClosestLineFromOffset(offset){
    const viewportHeight = lyricsViewport.clientHeight;
    const children = lyricsList.children;
    let closestIndex = -1;
    let closestDist = Infinity;

    for (let i = 0; i < children.length; i++){
      const el = children[i];
      const centerPos = el.offsetTop + el.offsetHeight / 2 + offset;
      const dist = Math.abs(centerPos - viewportHeight / 2);
      if (dist < closestDist){
        closestDist = dist;
        closestIndex = i;
      }
    }

    if (closestIndex !== -1 && closestIndex !== currentActiveIndex){
      const prevEl = lyricsList.children[currentActiveIndex];
      if (prevEl) prevEl.classList.remove('active');
      currentActiveIndex = closestIndex;
      const activeEl = lyricsList.children[currentActiveIndex];
      if (activeEl) activeEl.classList.add('active');
      updateLineDistances(currentActiveIndex);
      updateLrcHighlight();
      updateTimedBgVocals(player.currentTime);
    }
    return closestIndex;
  }

  function startDrag(clientY){
    isDragging = true;
    dragMoved = false;
    dragStartY = clientY;
    dragStartOffset = getCurrentTranslateY();
    wasPlayingBeforeDrag = !player.paused;
    if (wasPlayingBeforeDrag) player.pause();
    lyricsList.style.transition = 'none';
  }

  function moveDrag(clientY){
    if (!isDragging) return;
    const delta = clientY - dragStartY;
    if (Math.abs(delta) > 6) dragMoved = true;

    const newOffset = dragStartOffset + delta;
    lyricsList.style.transform = `translateY(${newOffset}px)`;
    updateClosestLineFromOffset(newOffset);
  }

  function endDrag(){
    if (!isDragging) return;
    isDragging = false;
    lyricsList.style.transition = ''; // vuelve a usar la transición suave del CSS

    const index = currentActiveIndex;
    if (index !== -1 && lyricsData[index]){
      player.currentTime = lyricsData[index].time;
    }
    setActiveLine(index); // recentra con la transición cubic-bezier y confirma el estado activo

    if (wasPlayingBeforeDrag) player.play();
  }

  lyricsViewport.addEventListener('mousedown', (e) => startDrag(e.clientY));
  window.addEventListener('mousemove', (e) => { if (isDragging) moveDrag(e.clientY); });
  window.addEventListener('mouseup', () => { if (isDragging) endDrag(); });

  lyricsViewport.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY), { passive: true });
  lyricsViewport.addEventListener('touchmove', (e) => {
    if (isDragging){
      e.preventDefault();
      moveDrag(e.touches[0].clientY);
    }
  }, { passive: false });
  lyricsViewport.addEventListener('touchend', () => endDrag());
  lyricsViewport.addEventListener('touchcancel', () => endDrag());

  // ---------- Modo grabación ----------
  recordModeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    panel.classList.add('hidden');
  });

  document.addEventListener('click', () => {
    if (dragMoved){
      dragMoved = false; // ese "click" vino de un gesto de scrubbing, se ignora
      return;
    }
    if (panel.classList.contains('hidden')){
      panel.classList.remove('hidden');
    }
  });

  window.addEventListener('resize', () => {
    centerActiveLine();
    positionTrackInfoBlock();
    updateLineDistances(currentActiveIndex);
  });


  // =====================================================================
  // ---------- Biblioteca de letras .lrc (persistencia con IndexedDB) ----------
  // Guarda letras completas (nombre + contenido + metadatos) en una base
  // IndexedDB local, permitiendo cientos de canciones sin tocar el disco
  // del usuario ni pedir archivos. No usa localStorage (solo IndexedDB),
  // según lo pedido. Todo el acceso pasa por una capa de promesas simple
  // para no depender de librerías externas.
  // =====================================================================
  const LRC_DB_NAME = 'lyricsPlayerLibrary';
  const LRC_DB_VERSION = 2; // v2: agrega el store 'session' para persistencia de audio/fondo/estado
  const LRC_STORE_NAME = 'lyrics';
  const SESSION_STORE_NAME = 'session';
  const SESSION_KEY = 'currentSession'; // única entrada: la sesión activa

  let lrcDbInstance = null;

  // Abre (o crea) la base de datos y sus object stores, devolviendo una
  // promesa que resuelve con la conexión ya lista para usar.
  function openLrcDatabase(){
    if (lrcDbInstance) return Promise.resolve(lrcDbInstance);

    return new Promise((resolve, reject) => {
      const request = indexedDB.open(LRC_DB_NAME, LRC_DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(LRC_STORE_NAME)){
          const store = db.createObjectStore(LRC_STORE_NAME, { keyPath: 'id', autoIncrement: true });
          store.createIndex('name', 'name', { unique: false });
          store.createIndex('updatedAt', 'updatedAt', { unique: false });
        }
        if (!db.objectStoreNames.contains(SESSION_STORE_NAME)){
          db.createObjectStore(SESSION_STORE_NAME, { keyPath: 'key' });
        }
      };

      request.onsuccess = (event) => {
        lrcDbInstance = event.target.result;
        resolve(lrcDbInstance);
      };

      request.onerror = () => reject(request.error);
    });
  }

  // =====================================================================
  // ---------- Persistencia de sesión (audio + fondo + .lrc + config) ----------
  // Guarda el estado completo del proyecto actual (incluyendo los Blobs
  // binarios de audio y fondo) en el store 'session' de la misma base de
  // datos IndexedDB, para poder restaurarlo automáticamente al refrescar
  // o reabrir la página, sin volver a pedir los archivos al usuario.
  // =====================================================================

  // Guarda (mezclando con lo existente) un fragmento del estado de sesión.
  // Se puede llamar con solo las claves que cambiaron; el resto se conserva.
  function saveSessionPartial(partial){
    return openLrcDatabase().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(SESSION_STORE_NAME, 'readwrite');
        const store = tx.objectStore(SESSION_STORE_NAME);
        const getReq = store.get(SESSION_KEY);

        getReq.onsuccess = () => {
          const current = getReq.result || { key: SESSION_KEY };
          const merged = Object.assign({}, current, partial, { key: SESSION_KEY, updatedAt: Date.now() });
          const putReq = store.put(merged);
          putReq.onsuccess = () => resolve(merged);
          putReq.onerror = () => reject(putReq.error);
        };
        getReq.onerror = () => reject(getReq.error);
      });
    });
  }

  function getSession(){
    return openLrcDatabase().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(SESSION_STORE_NAME, 'readonly');
        const store = tx.objectStore(SESSION_STORE_NAME);
        const request = store.get(SESSION_KEY);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    });
  }

  // Recolecta la configuración visual actual (sliders de fondo, fuente,
  // bilingüe, dos columnas, tamaño de letra) en un objeto plano guardable.
  function collectVisualSettings(){
    return {
      bgScale: bgScaleInput.value,
      bgPosX: bgPosXInput.value,
      bgPosY: bgPosYInput.value,
      bgBrightness: bgBrightnessInput.value,
      bgBlur: bgBlurInput.value,
      bgHue: bgHueInput.value,
      fontSize: fontSizeSlider ? fontSizeSlider.value : undefined,
      fontKey: (fontSwitcher.querySelector('.font-option.active') || {}).dataset
        ? fontSwitcher.querySelector('.font-option.active').dataset.font
        : undefined,
      bilingual: bilingualToggleBtn.classList.contains('active'),
      twoColumn: twoColumnToggleBtn.classList.contains('active')
    };
  }

  // Aplica una configuración visual previamente guardada a los controles
  // y dispara las mismas rutinas que usarían los listeners normales.
  function applyVisualSettings(settings){
    if (!settings) return;

    if (settings.bgScale !== undefined) bgScaleInput.value = settings.bgScale;
    if (settings.bgPosX !== undefined) bgPosXInput.value = settings.bgPosX;
    if (settings.bgPosY !== undefined) bgPosYInput.value = settings.bgPosY;
    if (settings.bgBrightness !== undefined) bgBrightnessInput.value = settings.bgBrightness;
    if (settings.bgBlur !== undefined) bgBlurInput.value = settings.bgBlur;
    if (settings.bgHue !== undefined) bgHueInput.value = settings.bgHue;
    updateBackgroundStyle();

    if (settings.fontSize !== undefined && fontSizeSlider){
      fontSizeSlider.value = settings.fontSize;
      fontSizeSlider.dispatchEvent(new Event('input'));
    }

    if (settings.fontKey && FONT_MAP[settings.fontKey]){
      document.documentElement.style.setProperty('--font-lyrics', FONT_MAP[settings.fontKey]);
      fontSwitcher.querySelectorAll('.font-option').forEach((opt) => {
        opt.classList.toggle('active', opt.dataset.font === settings.fontKey);
      });
    }

    if (settings.bilingual){
      bilingualToggleBtn.classList.add('active');
    }
    if (settings.twoColumn){
      twoColumnToggleBtn.classList.add('active');
    }
  }

  // Guarda el audio actual (como Blob) en la sesión.
  function persistAudioFile(file){
    saveSessionPartial({
      audioBlob: file,
      audioName: file.name,
      audioType: file.type
    }).catch((err) => console.error('No se pudo guardar el audio en la sesión:', err));
  }

  // Guarda el fondo actual (como Blob) en la sesión.
  function persistBackgroundFile(file){
    saveSessionPartial({
      bgBlob: file,
      bgName: file.name,
      bgType: file.type
    }).catch((err) => console.error('No se pudo guardar el fondo en la sesión:', err));
  }

  // Guarda el texto .lrc actual en la sesión (además del localStorage
  // existente, para que quede junto al resto del estado en IndexedDB).
  function persistLrcText(content){
    saveSessionPartial({ lrcText: content })
      .catch((err) => console.error('No se pudo guardar la letra en la sesión:', err));
  }

  // Guarda la configuración visual actual en la sesión.
  function persistVisualSettings(){
    saveSessionPartial({ visualSettings: collectVisualSettings() })
      .catch((err) => console.error('No se pudo guardar la configuración visual:', err));
  }

  // Restaura audio, fondo, letra y configuración visual desde IndexedDB
  // al iniciar la página, generando los ObjectURL correspondientes a
  // partir de los Blobs guardados.
  function restoreSession(){
    getSession().then((session) => {
      if (!session) return;

      // Audio
      if (session.audioBlob){
        try {
          const url = URL.createObjectURL(session.audioBlob);
          player.src = url;
          player.load();
        } catch (err) {
          console.error('No se pudo restaurar el audio guardado:', err);
        }
      }

      // Fondo (imagen o video)
      if (session.bgBlob){
        try {
          const url = URL.createObjectURL(session.bgBlob);
          const isVideo = (session.bgType || '').startsWith('video/');

          backgroundLayer.classList.remove('empty');

          if (isVideo){
            backgroundImage.classList.remove('visible');
            backgroundImage.removeAttribute('src');
            backgroundVideo.src = url;
            backgroundVideo.classList.add('visible');
            backgroundVideo.play().catch(() => {});
          } else {
            backgroundVideo.classList.remove('visible');
            backgroundVideo.pause();
            backgroundVideo.removeAttribute('src');
            backgroundImage.src = url;
            backgroundImage.classList.add('visible');
          }
        } catch (err) {
          console.error('No se pudo restaurar el fondo guardado:', err);
        }
      }

      // Letra .lrc (si existe en la sesión, tiene prioridad sobre la de
      // localStorage/ejemplo que ya se cargó al iniciar el script).
      if (session.lrcText){
        lrcInput.value = session.lrcText;
        loadLyricsFromTextarea();
      }

      // Configuración visual
      if (session.visualSettings){
        applyVisualSettings(session.visualSettings);
      }
    }).catch((err) => {
      console.error('No se pudo restaurar la sesión guardada:', err);
    });
  }

  // Guarda (o actualiza, si se pasa un id) una entrada de letra en la biblioteca.
  function saveLrcEntry(entry){
    return openLrcDatabase().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LRC_STORE_NAME, 'readwrite');
        const store = tx.objectStore(LRC_STORE_NAME);
        const request = store.put(entry);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    });
  }

  // Devuelve todas las entradas guardadas, ordenadas por más recientemente
  // actualizadas primero.
  function getAllLrcEntries(){
    return openLrcDatabase().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LRC_STORE_NAME, 'readonly');
        const store = tx.objectStore(LRC_STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => {
          const results = request.result || [];
          results.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
          resolve(results);
        };
        request.onerror = () => reject(request.error);
      });
    });
  }

  function deleteLrcEntry(id){
    return openLrcDatabase().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LRC_STORE_NAME, 'readwrite');
        const store = tx.objectStore(LRC_STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    });
  }

  function getLrcEntryById(id){
    return openLrcDatabase().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LRC_STORE_NAME, 'readonly');
        const store = tx.objectStore(LRC_STORE_NAME);
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    });
  }

  // ---------- Guardar la letra actual del textarea en la biblioteca ----------
  function saveCurrentLrcToLibrary(){
    const content = lrcInput.value;
    if (!content.trim()){
      alert('El campo de letra está vacío, no hay nada que guardar.');
      return;
    }

    const meta = parseLRCMeta(content);
    const suggestedName = meta.title
      ? (meta.artist ? `${meta.title} — ${meta.artist}` : meta.title)
      : '';

    const name = window.prompt('Nombre para guardar esta letra:', suggestedName);
    if (name === null) return; // el usuario canceló
    const finalName = name.trim() || 'Sin título';

    saveLrcEntry({
      name: finalName,
      title: meta.title,
      artist: meta.artist,
      content: content,
      updatedAt: Date.now()
    }).then(() => {
      // Si la biblioteca está abierta, refresca la lista al instante.
      if (libraryOverlay.classList.contains('visible')){
        renderLibraryList(librarySearchInput.value);
      }
    }).catch((err) => {
      console.error('No se pudo guardar la letra en la biblioteca:', err);
      alert('Ocurrió un error al guardar la letra. Intenta de nuevo.');
    });
  }

  saveToLibraryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    saveCurrentLrcToLibrary();
  });

  // ---------- Modal de biblioteca: abrir / cerrar ----------
  function openLibrary(){
    libraryOverlay.classList.add('visible');
    librarySearchInput.value = '';
    renderLibraryList('');
    // Foco diferido para evitar que el teclado móvil salte junto con la
    // animación de apertura del modal.
    setTimeout(() => librarySearchInput.focus(), 200);
  }

  function closeLibrary(){
    libraryOverlay.classList.remove('visible');
  }

  openLibraryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openLibrary();
  });

  libraryCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeLibrary();
  });

  // Cerrar al tocar el fondo oscuro (pero no al tocar el contenido del modal).
  libraryOverlay.addEventListener('click', (e) => {
    if (e.target === libraryOverlay) closeLibrary();
  });

  // Evita que un tap dentro del modal se propague y reabra/cierre el panel
  // de control principal (que escucha clicks en document).
  document.getElementById('libraryModal').addEventListener('click', (e) => {
    e.stopPropagation();
  });

  // ---------- Render de la lista de la biblioteca (con filtro en tiempo real) ----------
  function renderLibraryList(filterText){
    getAllLrcEntries().then((entries) => {
      const query = (filterText || '').trim().toLowerCase();

      const filtered = query
        ? entries.filter((entry) => {
            const haystack = `${entry.name || ''} ${entry.title || ''} ${entry.artist || ''}`.toLowerCase();
            return haystack.includes(query);
          })
        : entries;

      libraryList.innerHTML = '';
      libraryEmptyMsg.style.display = filtered.length ? 'none' : 'block';

      filtered.forEach((entry) => {
        const item = document.createElement('div');
        item.className = 'library-item';

        const nameEl = document.createElement('div');
        nameEl.className = 'library-item-name';
        nameEl.textContent = entry.name || entry.title || 'Sin título';

        const actions = document.createElement('div');
        actions.className = 'library-item-actions';

        const loadBtn = document.createElement('button');
        loadBtn.type = 'button';
        loadBtn.className = 'library-item-btn';
        loadBtn.textContent = '📄 Cargar';
        loadBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          lrcInput.value = entry.content;
          loadLyricsFromTextarea();
          closeLibrary();
        });

        const renameBtn = document.createElement('button');
        renameBtn.type = 'button';
        renameBtn.className = 'library-item-btn';
        renameBtn.textContent = '✏️ Renombrar';
        renameBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const newName = window.prompt('Nuevo nombre:', entry.name || '');
          if (newName === null) return;
          const finalName = newName.trim();
          if (!finalName) return;

          entry.name = finalName;
          entry.updatedAt = Date.now();
          saveLrcEntry(entry).then(() => {
            renderLibraryList(librarySearchInput.value);
          });
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'library-item-btn danger';
        deleteBtn.textContent = '🗑️ Eliminar';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const confirmed = window.confirm(`¿Eliminar "${entry.name || 'esta letra'}" de la biblioteca? Esta acción no se puede deshacer.`);
          if (!confirmed) return;

          deleteLrcEntry(entry.id).then(() => {
            renderLibraryList(librarySearchInput.value);
          });
        });

        actions.appendChild(loadBtn);
        actions.appendChild(renameBtn);
        actions.appendChild(deleteBtn);

        item.appendChild(nameEl);
        item.appendChild(actions);
        libraryList.appendChild(item);
      });
    }).catch((err) => {
      console.error('No se pudo leer la biblioteca de letras:', err);
      libraryList.innerHTML = '';
      libraryEmptyMsg.textContent = 'No se pudo cargar la biblioteca.';
      libraryEmptyMsg.style.display = 'block';
    });
  }

  // Buscador en tiempo real: filtra la lista en cada tecla, sin recargar el modal.
  librarySearchInput.addEventListener('input', () => {
    renderLibraryList(librarySearchInput.value);
  });

  // ---------- Estado inicial ----------
  loadLyricsFromTextarea();
  updateProgressUI();

  // Auto-restauración de sesión: recupera audio, fondo, letra y config
  // visual guardados en IndexedDB de una sesión anterior (si existen).
  // Se ejecuta después del estado inicial para que, si hay sesión guardada,
  // sus datos (en especial la letra) prevalezcan sobre el ejemplo/localStorage.
  restoreSession();
})();
</script>
</body>
</html>
